[project]
name = "tiaga"
version = "0.2.10"
authors = [{name = "Seems kushwaha"}]
description = "A CLI tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deep-translator>=1.11.4",
    "duckduckgo-search>=8.1.1",
    "click>=8.3.2",
    "httpx>=0.28.1",
    "openai>=1.0.0",
    "platformdirs>=4.3.8",
    "pydantic>=2.12.5",
    "python-dotenv>=1.1.1",
    "rich>=14.1.0",
    "tiktoken>=0.12.0",
    "tomli>=2.4.1",
    "youtube-transcript-api>=1.2.4",
    "ddgs>=9.13.0",
    "fastmcp>=3.2.3",
    "textual>=0.86.1",
]
[project.scripts]
tiaga = "tiaga.main:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
