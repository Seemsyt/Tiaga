[project]
name = "tiaga"
version = "0.1.1"
authors = [{name = "Seems kushwaha"}]
description = "A CLI tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "build>=1.4.2",
    "deep-translator>=1.11.4",
    "duckduckgo-search>=8.1.1",
    "mcp>=1.26.0",
    "python-dotenv>=1.1.1",
    "requests>=2.33.1",
    "rich>=14.1.0",
    "typer>=0.24.1",
    "youtube-transcript-api>=1.2.4",
    "prompt-toolkit>=3.0.50",
    "pygments>=2.19.0",
    "pydantic>=2.12.5",
    "click>=8.3.2",
    "tiktoken>=0.12.0",
    "tomli>=2.4.1",
]
[project.scripts]
tiaga = "tiaga.main:main"
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
